baseURL = "https://zapilates.com/"
languageCode = "en"
title = "Zapilates"
theme = "zapilates-studio"

[params]
  tagline = "Pilates with Marcelle Volckaert"
  description = "Pilates instruction, remedial work, and research with Marcelle Volckaert — over 20 years teaching Pilates on three continents. STOTT Pilates certified, MMus (cum laude) Stellenbosch University."
  author = "Marcelle Volckaert"
  location = "Lisbon & Marvão, Portugal"
  email = "marcelle@zapilates.com"

  # Stats strip (shown on home page)
  yearsTeaching = "20+"
  continents = "3"
  languages = "3"

  # Social
  instagram = "go_well_with_marcelle"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    identifier = "method"
    name = "The Method"
    url = "/about-pilates/"
    weight = 20

  [[menu.main]]
    identifier = "classes"
    name = "Classes"
    url = "/classes/"
    weight = 30

  [[menu.main]]
    identifier = "for-singers"
    name = "For Singers"
    url = "/for-singers/"
    weight = 40

  [[menu.main]]
    identifier = "for-dancers"
    name = "For Dancers"
    url = "/for-dancers/"
    weight = 45

  [[menu.main]]
    identifier = "workshops"
    name = "Workshops"
    url = "/workshops/"
    weight = 50

  [[menu.main]]
    identifier = "thesis"
    name = "Research"
    url = "/thesis/"
    weight = 55

  [[menu.main]]
    identifier = "studio"
    name = "Studio"
    url = "/studio/"
    weight = 60

  [[menu.main]]
    identifier = "journal"
    name = "Journal"
    url = "/blog/"
    weight = 70

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 80

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
