baseURL = "https://zapilates.com/"
languageCode = "en"
title = "Zapilates"
theme = "zapilates-studio"
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Pilates with Marcelle Sutton"
  description = "Pilates instruction, remedial work, and research with Marcelle Sutton — over 20 years teaching Pilates on three continents. STOTT Pilates certified, MMus (cum laude) Stellenbosch University."
  author = "Marcelle Sutton"
  location = "Leiria, Marvão & Lisbon, Portugal"
  email = "marcelle@zapilates.com"

  # Default hero image — used on the home page and as the fallback hero for any
  # page that does not set its own `image` in front matter.
  heroImage = "/images/IMG_0408.jpg"

  # Stats strip (shown on home page)
  yearsTeaching = "20+"
  continents = "3"
  languages = "3"

  # Social
  instagram = "go_well_with_marcelle"

[menu]
  # ---- About ----
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    parent = "about"
    name = "About Marcelle"
    url = "/about/"
    weight = 11
  [[menu.main]]
    parent = "about"
    name = "The Method"
    url = "/about-pilates/"
    weight = 12

  # ---- Classes ----
  [[menu.main]]
    identifier = "classes"
    name = "Classes"
    url = "/classes/"
    weight = 20
  [[menu.main]]
    parent = "classes"
    name = "Private"
    url = "/classes/private/"
    weight = 21
  [[menu.main]]
    parent = "classes"
    name = "Group"
    url = "/classes/group/"
    weight = 22
  [[menu.main]]
    parent = "classes"
    name = "Barre"
    url = "/classes/barre/"
    weight = 23
  [[menu.main]]
    parent = "classes"
    name = "Remedial"
    url = "/classes/remedial/"
    weight = 24

  # ---- For Performers ----
  [[menu.main]]
    identifier = "performers"
    name = "For Performers"
    url = "/for-performers/"
    weight = 30
  [[menu.main]]
    parent = "performers"
    name = "For Singers"
    url = "/for-singers/"
    weight = 31
  [[menu.main]]
    parent = "performers"
    name = "For Dancers"
    url = "/for-dancers/"
    weight = 32
  [[menu.main]]
    parent = "performers"
    name = "Workshops"
    url = "/workshops/"
    weight = 33
  [[menu.main]]
    parent = "performers"
    name = "Research"
    url = "/research/"
    weight = 34

  # ---- Contact (rendered as the header CTA) ----
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 50

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"


[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]


[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
